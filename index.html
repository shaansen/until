<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Countdowns</title>

  <!-- PWA / iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Countdowns" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23eef7f0'/><circle cx='50' cy='52' r='28' fill='none' stroke='%233d6b51' stroke-width='5'/><line x1='50' y1='52' x2='50' y2='34' stroke='%233d6b51' stroke-width='5' stroke-linecap='round'/><line x1='50' y1='52' x2='64' y2='58' stroke='%2374b292' stroke-width='5' stroke-linecap='round'/></svg>" />
  <meta name="theme-color" content="#eef7f0" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #3d6b51;   /* deep sage — text */
      --sage:  #74b292;   /* mid sage */
      --mint:  #a8cdb8;   /* soft mint */
      --bg:    #eef7f0;   /* pale mint background */
    }

    html, body {
      height: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--green);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Soft blobs (shared background) ── */
    .blob { position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0; }
    .blob-1 { width:65vw; height:65vw; background:#cdeede; opacity:.55; top:-15vw; left:-15vw; animation:drift1 18s ease-in-out infinite alternate; }
    .blob-2 { width:55vw; height:55vw; background:#d8eecb; opacity:.5;  bottom:-10vw; right:-10vw; animation:drift2 22s ease-in-out infinite alternate; }
    .blob-3 { width:40vw; height:40vw; background:#d2f0e6; opacity:.45; top:35%; left:30%; animation:drift3 26s ease-in-out infinite alternate; }

    @keyframes drift1 { to { transform: translate(8vw,  6vw) scale(1.1);  } }
    @keyframes drift2 { to { transform: translate(-6vw,-8vw) scale(1.08); } }
    @keyframes drift3 { to { transform: translate(5vw, -5vw) scale(0.92); } }

    /* ── Views ── */
    .view { position: fixed; inset: 0; z-index: 2; display: none; flex-direction: column; }
    .view.active { display: flex; animation: fadeIn .45s ease both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ────────────────────────────  LIST VIEW  ──────────────────────────── */
    #view-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(env(safe-area-inset-top) + 1.6rem) 1.2rem calc(env(safe-area-inset-bottom) + 6.5rem); }

    .list-head {
      text-align: center;
      margin: 0.4rem 0 1.8rem;
    }
    .list-head h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 9vw, 2.7rem);
      letter-spacing: -0.025em;
    }
    .list-head p {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage);
      margin-top: 0.55rem;
    }

    .cards { display: flex; flex-direction: column; gap: 1rem; max-width: 560px; width: 100%; margin: 0 auto; }

    .event-card {
      position: relative;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(116,178,146,0.25);
      border-radius: 22px;
      padding: 1.25rem 1.4rem;
      box-shadow: 0 8px 30px rgba(61,107,81,0.07);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: hidden;
    }
    .event-card:active { transform: scale(0.985); box-shadow: 0 4px 16px rgba(61,107,81,0.1); }

    .event-card .title {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
      line-height: 1.15;
      margin-bottom: 0.6rem;
    }
    .event-card .remaining {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.85rem;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      color: var(--green);
    }
    .event-card .remaining .lbl {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sage);
      margin-left: 0.2em;
    }
    .event-card .when {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 0.01em;
      color: var(--mint);
      margin-top: 0.6rem;
    }
    .event-card.past .remaining { color: var(--mint); }
    .event-card .ribbon {
      position: absolute;
      top: 0; right: 0;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
      background: var(--sage);
      padding: 0.2rem 0.7rem;
      border-bottom-left-radius: 12px;
    }

    .empty {
      text-align: center;
      margin-top: 4rem;
      font-family: 'Inter', sans-serif;
      font-style: normal;
      font-size: 1.2rem;
      color: var(--mint);
      line-height: 1.6;
    }

    /* Floating add button */
    .fab {
      position: fixed;
      z-index: 6;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 1.4rem);
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: var(--green);
      border: none;
      border-radius: 999px;
      padding: 0.9rem 1.7rem;
      box-shadow: 0 10px 28px rgba(61,107,81,0.35);
      cursor: pointer;
    }
    .fab:active { transform: translateX(-50%) scale(0.96); }
    .fab svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    body[data-view="list"] .fab { display: inline-flex; }
    body:not([data-view="list"]) .fab { display: none; }

    /* ────────────────────────────  DETAIL VIEW  ──────────────────────────── */
    #view-detail { align-items: center; }

    .top-bar {
      position: relative;
      z-index: 5;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 0.8rem) 1rem 0.4rem;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent; cursor: pointer; padding: 0;
    }
    .icon-btn svg { width: 22px; height: 22px; stroke: var(--green); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .detail-title {
      flex: 1;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sage);
      padding: 0 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage {
      position: relative;
      z-index: 3;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }

    /* Chevrons */
    .chevron { position: absolute; left: 50%; transform: translateX(-50%); z-index: 4; pointer-events: none; }
    .chevron.top    { top: 0.5rem; }
    .chevron.bottom { bottom: 0.5rem; }
    .chevron.hidden { opacity: 0 !important; }
    .chevron svg { width: 18px; height: 10px; stroke: var(--mint); stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .chevron.bottom svg { animation: chevronDown 2.5s ease-in-out 0.4s infinite; }
    .chevron.top    svg { animation: chevronUp   2.5s ease-in-out 0s   infinite; }
    @keyframes chevronDown { 0%,100%{opacity:.2;transform:translateY(0)}  50%{opacity:.6;transform:translateY(3px)}  }
    @keyframes chevronUp   { 0%,100%{opacity:.2;transform:translateY(0)}  50%{opacity:.6;transform:translateY(-3px)} }

    /* Unit cards */
    .unit-card {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.9rem; pointer-events: none; padding: 0 1.5rem; opacity: 0;
    }
    .unit-card.active { pointer-events: auto; opacity: 1; }
    .ornament {
      font-family: 'Inter', sans-serif;
      font-weight: 600; font-size: clamp(0.85rem, 3.4vw, 1.1rem);
      letter-spacing: 0.42em; color: var(--sage);
      text-transform: uppercase; text-align: center; order: -1;
      padding-left: 0.42em;
    }
    .big-num { font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--green); text-align: center; width: 100%; }

    /* Congrats */
    #congrats { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; padding: 0 1.5rem; }
    #congrats.visible { display: flex; animation: popIn 1.2s ease both; }
    #congrats .congrats-text { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.03em; font-size: clamp(2.6rem, 15vw, 6.5rem); text-align: center; line-height: 1.1; }
    #congrats .congrats-sub { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.85rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sage); margin-top: 1.1rem; text-align: center; }
    @keyframes popIn { from { opacity:0; transform: scale(0.95); } to { opacity:1; transform: none; } }

    /* Slide transitions */
    .exit-up    { animation: exitUp    0.55s cubic-bezier(0.4,0,0.2,1) both; }
    .exit-down  { animation: exitDown  0.55s cubic-bezier(0.4,0,0.2,1) both; }
    .enter-up   { animation: enterUp   0.55s cubic-bezier(0.4,0,0.2,1) both; }
    .enter-down { animation: enterDown 0.55s cubic-bezier(0.4,0,0.2,1) both; }
    @keyframes exitUp    { to   { opacity:0; transform:translateY(-60px) scale(0.92); filter:blur(6px); } }
    @keyframes exitDown  { to   { opacity:0; transform:translateY( 60px) scale(0.92); filter:blur(6px); } }
    @keyframes enterUp   { from { opacity:0; transform:translateY( 60px) scale(0.92); filter:blur(6px); } to { opacity:1; transform:none; filter:blur(0); } }
    @keyframes enterDown { from { opacity:0; transform:translateY(-60px) scale(0.92); filter:blur(6px); } to { opacity:1; transform:none; filter:blur(0); } }

    /* Bottom dots */
    .bottom-bar { position: relative; z-index: 3; display: flex; align-items: center; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom, 0.8rem) + 1.4rem); padding-top: 0.4rem; flex-shrink: 0; }
    .dots { display: flex; gap: 0; align-items: flex-end; }
    .dot-item { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 10px 0; cursor: pointer; }
    .dot-pip { width: 5px; height: 5px; border-radius: 50%; background: var(--mint); opacity: 0.3; transition: all 0.35s ease; }
    .dot-item.active .dot-pip { width:18px; border-radius:3px; background:var(--green); opacity:1; }
    .dot-lbl { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.55rem; letter-spacing: 0.14em; color: var(--mint); opacity: 0.4; transition: opacity 0.35s ease, color 0.35s ease; text-transform: uppercase; }
    .dot-item.active .dot-lbl { color: var(--green); opacity: 1; }

    /* ────────────────────────────  FORM VIEW  ──────────────────────────── */
    #view-form { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(env(safe-area-inset-top) + 0.8rem) 1.2rem calc(env(safe-area-inset-bottom) + 2rem); }
    .form-wrap { max-width: 480px; width: 100%; margin: 0 auto; }
    .form-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .form-head h2 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: -0.02em; }

    .field { margin-bottom: 1.5rem; }
    .field label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 0.55rem;
    }
    .field input {
      width: 100%;
      user-select: text;
      -webkit-user-select: text;
      font-family: 'Inter', sans-serif;
      font-size: 1.2rem;
      color: var(--green);
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(116,178,146,0.35);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(116,178,146,0.15); }
    .field-row { display: flex; gap: 0.8rem; }
    .field-row .field { flex: 1; }

    .form-actions { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 2.2rem; }
    .btn {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      border-radius: 999px;
      padding: 0.95rem 1.4rem;
      border: none;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 10px 24px rgba(61,107,81,0.3); }
    .btn-ghost { background: transparent; color: var(--sage); }
    .btn-danger { background: transparent; color: #b14b6b; border: 1px solid rgba(177,75,107,0.3); }
    .form-err { color: #b14b6b; font-family: 'Inter', sans-serif; font-style: normal; min-height: 1.2rem; text-align: center; margin-top: 0.4rem; }
  </style>
</head>
<body data-view="list">

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- ───────── LIST VIEW ───────── -->
<section class="view active" id="view-list">
  <div class="list-head">
    <h1>Countdowns</h1>
    <p>every moment, on its way</p>
  </div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" style="display:none;">
    nothing yet —<br />tap <em>＋ new</em> to begin counting.
  </div>
</section>

<button class="fab" id="fab">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  new
</button>

<!-- ───────── DETAIL VIEW ───────── -->
<section class="view" id="view-detail">
  <div class="top-bar">
    <button class="icon-btn" id="btn-back" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="detail-title" id="detail-title"></div>
    <button class="icon-btn" id="btn-edit" aria-label="Edit">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="chevron top hidden" id="chev-top">
      <svg viewBox="0 0 18 10"><polyline points="1,9 9,1 17,9"/></svg>
    </div>

    <div class="unit-card" id="card-0"><span class="ornament">weeks</span><span class="big-num" id="val-0">--</span></div>
    <div class="unit-card" id="card-1"><span class="ornament">days</span><span class="big-num" id="val-1">--</span></div>
    <div class="unit-card" id="card-2"><span class="ornament">hours</span><span class="big-num" id="val-2">--</span></div>
    <div class="unit-card" id="card-3"><span class="ornament">minutes</span><span class="big-num" id="val-3">--</span></div>
    <div class="unit-card" id="card-4"><span class="ornament">seconds</span><span class="big-num" id="val-4">--</span></div>

    <div id="congrats">
      <span class="congrats-text" id="congrats-text">It's time</span>
      <span class="congrats-sub" id="congrats-sub"></span>
    </div>

    <div class="chevron bottom hidden" id="chev-bottom">
      <svg viewBox="0 0 18 10"><polyline points="1,1 9,9 17,1"/></svg>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="dots" id="dots"></div>
  </div>
</section>

<!-- ───────── FORM VIEW ───────── -->
<section class="view" id="view-form">
  <div class="form-wrap">
    <div class="form-head">
      <button class="icon-btn" id="btn-form-cancel" aria-label="Cancel">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2 id="form-title">New countdown</h2>
      <span style="width:42px"></span>
    </div>

    <form id="form">
      <div class="field">
        <label for="f-title">What are you counting to?</label>
        <input id="f-title" type="text" placeholder="e.g. EAD Approval" maxlength="60" autocomplete="off" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-date">Date</label>
          <input id="f-date" type="date" />
        </div>
        <div class="field">
          <label for="f-time">Time</label>
          <input id="f-time" type="time" />
        </div>
      </div>
      <div class="form-err" id="form-err"></div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
        <button type="button" class="btn btn-danger" id="btn-delete" style="display:none;">Delete</button>
      </div>
    </form>
  </div>
</section>

<script>
  /* ──────────────────────────  STORAGE  ──────────────────────────
     All countdowns live in localStorage on THIS device only.
     Nothing is uploaded or synced anywhere. */
  const KEY = 'countdowns.v1';

  function loadAll() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }
  function saveAll(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  // Seed one example on first ever launch, so the app isn't empty.
  if (localStorage.getItem(KEY) === null) {
    saveAll([
      { id: uid(), title: 'Our Wedding', target: '2026-09-26T15:00:00' }
    ]);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ──────────────────────────  HELPERS  ────────────────────────── */
  const UNITS = [
    { key: 'weeks',   shortKey: 'weeks', divisor: 7 * 86400000 },
    { key: 'days',    shortKey: 'days',  divisor: 86400000 },
    { key: 'hours',   shortKey: 'hours', divisor: 3600000 },
    { key: 'minutes', shortKey: 'mins',  divisor: 60000 },
    { key: 'seconds', shortKey: 'secs',  divisor: 1000 },
  ];

  function fmt(n) { return Math.floor(n).toLocaleString('en-US'); }

  // Always interpret a stored target as LOCAL wall-clock time (never UTC).
  // Targets are stored without a timezone ("YYYY-MM-DDTHH:mm:ss"); we parse the
  // parts and build the Date via the local constructor so the behaviour is
  // identical on every browser and there's no chance of a UTC interpretation.
  function targetDate(ev) {
    const [datePart, timePart = '00:00:00'] = String(ev.target).split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    const [hh = 0, mm = 0, ss = 0] = timePart.split(':').map(Number);
    return new Date(y, (m || 1) - 1, d || 1, hh, mm, ss);
  }

  function formatWhen(d) {
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  // Short summary for list cards: biggest two non-zero units.
  function summarize(diff) {
    if (diff <= 0) return null;
    const parts = [];
    let rem = diff;
    const steps = [
      ['week', 7 * 86400000], ['day', 86400000],
      ['hour', 3600000], ['min', 60000],
    ];
    for (const [name, ms] of steps) {
      const v = Math.floor(rem / ms);
      if (v > 0) { parts.push({ v, name }); rem -= v * ms; }
      if (parts.length === 2) break;
    }
    if (parts.length === 0) {
      const secs = Math.floor(diff / 1000);
      parts.push({ v: secs, name: 'sec' });
    }
    return parts;
  }

  /* ──────────────────────────  VIEW ROUTER  ────────────────────── */
  function showView(name) {
    document.body.dataset.view = name;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
  }

  /* ──────────────────────────  LIST VIEW  ──────────────────────── */
  const cardsEl = document.getElementById('cards');
  const emptyEl = document.getElementById('empty');
  let listTimer = null;
  let lastListSig = '';

  // A compact fingerprint of what the list currently displays, so the live
  // timer only rebuilds the DOM when something visible actually changed
  // (avoids destroying card nodes mid-tap once per second).
  function listSignature() {
    return loadAll().sort((a, b) => targetDate(a) - targetDate(b)).map(ev => {
      const diff = targetDate(ev) - Date.now();
      if (diff <= 0) return ev.id + '|' + ev.title + '|done';
      const p = summarize(diff).map(x => x.v + x.name).join(',');
      return ev.id + '|' + ev.title + '|' + ev.target + '|' + p;
    }).join('§');
  }

  function renderList() {
    const list = loadAll().sort((a, b) => targetDate(a) - targetDate(b));
    cardsEl.innerHTML = '';
    emptyEl.style.display = list.length ? 'none' : 'block';

    list.forEach(ev => {
      const d = targetDate(ev);
      const diff = d - Date.now();
      const card = document.createElement('div');
      card.className = 'event-card' + (diff <= 0 ? ' past' : '');

      let remainingHtml;
      if (diff <= 0) {
        remainingHtml = `<div class="ribbon">done</div><div class="remaining">🎉 here</div>`;
      } else {
        const parts = summarize(diff);
        remainingHtml = '<div class="remaining">' + parts.map(p =>
          `${p.v.toLocaleString('en-US')}<span class="lbl">${p.name}${p.v === 1 ? '' : 's'}</span>`
        ).join(' &nbsp; ') + '</div>';
      }

      card.innerHTML = `
        ${remainingHtml}
        <div class="title">${escapeHtml(ev.title)}</div>
        <div class="when">${formatWhen(d)}</div>`;
      card.addEventListener('click', () => openDetail(ev.id));
      cardsEl.appendChild(card);
    });
    lastListSig = listSignature();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ──────────────────────────  DETAIL VIEW  ────────────────────── */
  const cards      = UNITS.map((_, i) => document.getElementById('card-' + i));
  const valEls     = UNITS.map((_, i) => document.getElementById('val-' + i));
  const dotsEl     = document.getElementById('dots');
  const chevTop    = document.getElementById('chev-top');
  const chevBottom = document.getElementById('chev-bottom');
  const congratsEl = document.getElementById('congrats');
  const congratsSub= document.getElementById('congrats-sub');
  const detailTitle= document.getElementById('detail-title');

  let current  = null;   // current event object
  let visible  = [];
  let pos      = 0;
  let busy     = false;
  let lastNav  = 0;
  let done     = false;
  let detailTimer = null;
  const COOLDOWN = 750;

  function scaleFontToFit(el, str) {
    const byW = (window.innerWidth  * 0.88) / (str.length * 0.58);
    const byH = window.innerHeight * 0.40;
    el.style.fontSize = Math.max(Math.min(byW, byH), 40) + 'px';
  }

  function openDetail(id) {
    current = loadAll().find(e => e.id === id);
    if (!current) { renderList(); return; }

    detailTitle.textContent = current.title;
    congratsSub.textContent = current.title;
    done = false; pos = 0; visible = []; busy = false;
    cards.forEach(c => c.classList.remove('active', 'exit-up', 'exit-down', 'enter-up', 'enter-down'));
    congratsEl.classList.remove('visible');
    dotsEl.innerHTML = '';

    showView('detail');
    tick();
    clearInterval(detailTimer);
    detailTimer = setInterval(tick, 1000);
  }

  function leaveDetail() {
    clearInterval(detailTimer);
    detailTimer = null;
    current = null;
  }

  function rebuildDots() {
    dotsEl.innerHTML = '';
    visible.forEach((unitIdx, dotPos) => {
      const item = document.createElement('div');
      item.className = 'dot-item' + (dotPos === pos ? ' active' : '');
      item.innerHTML = `<div class="dot-pip"></div><span class="dot-lbl">${UNITS[unitIdx].shortKey}</span>`;
      item.addEventListener('click', () => navigateTo(dotPos, dotPos > pos ? 1 : -1));
      dotsEl.appendChild(item);
    });
  }
  function updateActiveDot() {
    Array.from(dotsEl.querySelectorAll('.dot-item')).forEach((el, i) => el.classList.toggle('active', i === pos));
  }
  function updateChevrons() {
    chevTop.classList.toggle('hidden', pos === 0);
    chevBottom.classList.toggle('hidden', pos === visible.length - 1);
  }

  function navigateTo(newPos, dir) {
    if (done || busy || newPos === pos || newPos < 0 || newPos >= visible.length) return;
    const now = Date.now();
    if (now - lastNav < COOLDOWN) return;
    lastNav = now; busy = true;

    const outCard = cards[visible[pos]];
    pos = newPos;
    const inCard = cards[visible[pos]];

    outCard.classList.add(dir > 0 ? 'exit-up'  : 'exit-down');
    inCard.classList.add( dir > 0 ? 'enter-up' : 'enter-down');
    inCard.classList.add('active');

    outCard.addEventListener('animationend', () => {
      outCard.classList.remove('exit-up', 'exit-down', 'active');
    }, { once: true });
    inCard.addEventListener('animationend', () => {
      inCard.classList.remove('enter-up', 'enter-down');
      busy = false;
    }, { once: true });

    updateActiveDot();
    updateChevrons();
  }

  const fwd  = () => navigateTo(pos + 1,  1);
  const back = () => navigateTo(pos - 1, -1);

  function syncVisible(diff) {
    const newVisible = UNITS.map((u, i) => i).filter(i => Math.floor(diff / UNITS[i].divisor) >= 1);
    if (JSON.stringify(newVisible) === JSON.stringify(visible)) return;

    const activeUnit = visible[pos] ?? newVisible[0];
    cards.forEach(c => c.classList.remove('active'));
    visible = newVisible;
    let newPos = visible.indexOf(activeUnit);
    if (newPos === -1) newPos = 0;
    pos = newPos;
    if (visible.length > 0) cards[visible[pos]].classList.add('active');
    rebuildDots();
    updateChevrons();
  }

  function tick() {
    if (!current) return;
    const diff = targetDate(current) - Date.now();

    if (diff <= 0) {
      if (!done) {
        done = true;
        cards.forEach(c => c.classList.remove('active'));
        dotsEl.innerHTML = '';
        chevTop.classList.add('hidden');
        chevBottom.classList.add('hidden');
        congratsEl.classList.add('visible');
      }
      return;
    }

    UNITS.forEach((u, i) => {
      const s = fmt(diff / u.divisor);
      valEls[i].textContent = s;
      scaleFontToFit(valEls[i], s);
    });
    syncVisible(diff);
  }

  /* ──────────────────────────  FORM VIEW  ──────────────────────── */
  const form        = document.getElementById('form');
  const fTitle       = document.getElementById('f-title');
  const fDate        = document.getElementById('f-date');
  const fTime        = document.getElementById('f-time');
  const formErr      = document.getElementById('form-err');
  const formTitle    = document.getElementById('form-title');
  const btnDelete    = document.getElementById('btn-delete');
  let editingId = null;

  function openForm(id) {
    editingId = id || null;
    formErr.textContent = '';
    if (editingId) {
      const ev = loadAll().find(e => e.id === editingId);
      const d = targetDate(ev);
      formTitle.textContent = 'Edit countdown';
      fTitle.value = ev.title;
      fDate.value  = toDateInput(d);
      fTime.value  = toTimeInput(d);
      btnDelete.style.display = 'block';
    } else {
      formTitle.textContent = 'New countdown';
      fTitle.value = '';
      fDate.value  = '';
      fTime.value  = '';
      btnDelete.style.display = 'none';
    }
    showView('form');
  }

  function toDateInput(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function toTimeInput(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function pad(n) { return String(n).padStart(2, '0'); }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const title = fTitle.value.trim();
    if (!title) { formErr.textContent = 'Give it a name.'; return; }
    if (!fDate.value) { formErr.textContent = 'Pick a date.'; return; }

    let hh = 0, mm = 0;
    if (fTime.value) { [hh, mm] = fTime.value.split(':').map(Number); }
    const iso = `${fDate.value}T${pad(hh)}:${pad(mm)}:00`;

    const list = loadAll();
    if (editingId) {
      const ev = list.find(e => e.id === editingId);
      ev.title = title; ev.target = iso;
    } else {
      list.push({ id: uid(), title, target: iso });
    }
    saveAll(list);
    renderList();
    showView('list');
  });

  btnDelete.addEventListener('click', () => {
    if (!editingId) return;
    if (!confirm('Delete this countdown?')) return;
    saveAll(loadAll().filter(e => e.id !== editingId));
    renderList();
    showView('list');
  });

  /* ──────────────────────────  WIRING  ─────────────────────────── */
  document.getElementById('fab').addEventListener('click', () => openForm(null));
  document.getElementById('btn-back').addEventListener('click', () => { leaveDetail(); renderList(); showView('list'); });
  document.getElementById('btn-edit').addEventListener('click', () => { if (current) { const id = current.id; leaveDetail(); openForm(id); } });
  document.getElementById('btn-form-cancel').addEventListener('click', () => { renderList(); showView('list'); });

  // Refresh list cards live while on the list.
  function startListTimer() {
    clearInterval(listTimer);
    listTimer = setInterval(() => {
      if (document.body.dataset.view !== 'list') return;
      if (listSignature() !== lastListSig) renderList();
    }, 1000);
  }

  // Gesture / key handlers — only act inside the detail view.
  let ty = null, tx = null;
  document.addEventListener('touchstart', e => { ty = e.touches[0].clientY; tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (document.body.dataset.view !== 'detail' || ty === null) { ty = tx = null; return; }
    const dy = ty - e.changedTouches[0].clientY;
    const dx = e.changedTouches[0].clientX - tx;
    // Horizontal swipe right → back to list
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) && dx > 0) {
      leaveDetail(); renderList(); showView('list');
    } else if (Math.abs(dy) > 40 && Math.abs(dy) >= Math.abs(dx)) {
      dy > 0 ? fwd() : back();
    }
    ty = tx = null;
  }, { passive: true });

  document.addEventListener('wheel', e => {
    if (document.body.dataset.view !== 'detail') return;
    e.preventDefault();
    if (Math.abs(e.deltaY) < 8) return;
    e.deltaY > 0 ? fwd() : back();
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (document.body.dataset.view === 'detail') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') fwd();
      if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  back();
      if (e.key === 'Escape') { leaveDetail(); renderList(); showView('list'); }
    } else if (document.body.dataset.view === 'form' && e.key === 'Escape') {
      renderList(); showView('list');
    }
  });

  window.addEventListener('resize', () => { if (document.body.dataset.view === 'detail' && !done) tick(); });

  /* ──────────────────────────  BOOT  ───────────────────────────── */
  renderList();
  startListTimer();
  showView('list');
</script>
</body>
</html>
